<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gestão Educacional — Atividades</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--primary:#2563eb;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;--ok:#16a34a;--danger:#dc2626}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text)}
    header{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;padding:24px}
    .wrap{max-width:1150px;margin:auto;padding:0 18px}.brand{font-size:24px;font-weight:800}.sub{opacity:.85;margin-top:4px}
    nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
    nav button{background:rgba(255,255,255,.15);color:#fff}.active{background:#fff!important;color:#1d4ed8!important}
    main{padding:24px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
    .card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 5px 20px #0f172a10;border:1px solid #e2e8f0}
    h2,h3{margin-top:0}.muted{color:var(--muted)}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 12px;font:inherit}
    .primary{background:var(--primary);color:#fff}.danger{background:#fee2e2;color:var(--danger)}.ok{color:var(--ok);font-weight:700}
    .activity{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{background:#dbeafe;color:#1d4ed8;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}
    .hidden{display:none!important}.question{border-top:1px solid #e2e8f0;padding-top:18px;margin-top:18px}.answer{display:block;margin:8px 0}
    .toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;display:none}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0;font-size:14px}
    .live{display:inline-flex;align-items:center;gap:7px}.dot{width:9px;height:9px;background:#22c55e;border-radius:50%;animation:pulse 1.5s infinite}
    @keyframes pulse{50%{opacity:.35}}.stat{font-size:30px;font-weight:800}
  </style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">🎓 Gestão Educacional</div><div class="sub">Atividades, alunos e acompanhamento em tempo real</div>
  <nav>
    <button class="active" onclick="show('student',this)">Aluno</button>
    <button onclick="show('teacher',this)">Professor</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="student">
    <div class="grid">
      <div class="card">
        <h2>Identificação</h2>
        <label>Nome do aluno</label><input id="studentName" placeholder="Digite seu nome">
        <label>Turma</label><input id="studentClass" placeholder="Ex.: 702">
        <button class="primary" onclick="saveStudent()">Continuar</button>
        <p id="studentStatus" class="muted"></p>
      </div>
      <div class="card">
        <h2>Atividades</h2>
        <div id="activityList" class="muted">Carregando...</div>
      </div>
    </div>
    <div id="activityArea" class="card hidden" style="margin-top:16px"></div>
  </section>

  <section id="teacher" class="hidden">
    <div class="grid">
      <div class="card"><div class="muted">Alunos cadastrados</div><div id="statStudents" class="stat">0</div></div>
      <div class="card"><div class="muted">Entregas</div><div id="statSubmissions" class="stat">0</div></div>
      <div class="card"><div class="muted">Atualização</div><div class="live"><span class="dot"></span> tempo real</div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>Criar atividade</h2>
      <label>Título</label><input id="newTitle" placeholder="Ex.: Frações — 7º ano">
      <label>Turma</label><input id="newClass" placeholder="Ex.: 702">
      <label>Descrição</label><textarea id="newDesc" placeholder="Orientações para os alunos"></textarea>
      <label>Questões (uma por linha no formato: pergunta | alternativa A | alternativa B | alternativa C | alternativa D | letra correta)</label>
      <textarea id="newQuestions" rows="7" placeholder="Quanto é 2+2? | 3 | 4 | 5 | 6 | B"></textarea>
      <button class="primary" onclick="createActivity()">Publicar atividade</button>
    </div>
    <div class="card" style="margin-top:16px"><h2>Entregas em tempo real</h2><div id="submissions">Carregando...</div></div>
    <div class="card" style="margin-top:16px"><h2>Atividades publicadas</h2><div id="teacherActivities">Carregando...</div></div>
  </section>
</main>
<div id="toast" class="toast"></div>

<script>
const CONFIG = {
  SUPABASE_URL: "COLE_AQUI_A_URL_DO_SEU_SUPABASE",
  SUPABASE_ANON_KEY: "COLE_AQUI_A_CHAVE_ANON"
};
let db=null, currentStudent=null, currentActivity=null;

function configured(){return !CONFIG.SUPABASE_URL.startsWith("COLE_") && !CONFIG.SUPABASE_ANON_KEY.startsWith("COLE_")}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function show(id,btn){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='teacher')refreshTeacher()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function init(){
  if(!configured()){toast('Configure o Supabase no arquivo index.html.');document.getElementById('activityList').innerHTML='<b>Configuração pendente.</b><br>Abra o arquivo e preencha SUPABASE_URL e SUPABASE_ANON_KEY.';return}
  db=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
  await loadActivities(); await loadSubmissions();
  db.channel('realtime-educacional')
    .on('postgres_changes',{event:'*',schema:'public',table:'activities'},loadActivities)
    .on('postgres_changes',{event:'*',schema:'public',table:'submissions'},()=>{loadSubmissions();refreshTeacher()})
    .subscribe();
}
async function saveStudent(){
  const name=document.getElementById('studentName').value.trim(), cls=document.getElementById('studentClass').value.trim();
  if(!name||!cls)return toast('Preencha nome e turma.');
  const {data,error}=await db.from('students').upsert({name,student_class:cls},{onConflict:'name,student_class'}).select().single();
  if(error)return toast(error.message);
  currentStudent=data;document.getElementById('studentStatus').textContent='Identificação salva. Escolha uma atividade.';
  loadActivities();
}
async function loadActivities(){
  if(!db)return;
  const {data,error}=await db.from('activities').select('*').eq('published',true).order('created_at',{ascending:false});
  if(error)return;
  const cls=document.getElementById('studentClass').value.trim();
  const list=data.filter(a=>!cls||a.student_class===cls||a.student_class==='TODAS');
  document.getElementById('activityList').innerHTML=list.length?list.map(a=>`<div class="card activity" style="margin:8px 0;padding:14px"><div><b>${esc(a.title)}</b><div class="muted">${esc(a.description||'')}</div><span class="tag">${esc(a.student_class)}</span></div><button class="primary" onclick="openActivity('${a.id}')">Responder</button></div>`).join(''):'Nenhuma atividade disponível.';
  const {data:all}=await db.from('activities').select('*').order('created_at',{ascending:false});
  document.getElementById('teacherActivities').innerHTML=(all||[]).map(a=>`<div style="padding:10px 0;border-bottom:1px solid #e2e8f0"><b>${esc(a.title)}</b> — ${esc(a.student_class)}</div>`).join('');
}
async function openActivity(id){
  if(!currentStudent)return toast('Primeiro informe seu nome e turma.');
  const {data,error}=await db.from('activities').select('*').eq('id',id).single(); if(error)return toast(error.message); currentActivity=data;
  let qs=Array.isArray(data.questions)?data.questions:JSON.parse(data.questions);
  document.getElementById('activityArea').classList.remove('hidden');
  document.getElementById('activityArea').innerHTML=`<h2>${esc(data.title)}</h2><p class="muted">${esc(data.description||'')}</p>`+
    qs.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q.question)}</b>${q.options.map((o,j)=>`<label class="answer"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`).join('')+
    `<button class="primary" style="margin-top:20px" onclick="submitActivity()">Enviar respostas</button>`;
  scrollTo({top:document.getElementById('activityArea').offsetTop-20,behavior:'smooth'});
}
async function submitActivity(){
  const qs=Array.isArray(currentActivity.questions)?currentActivity.questions:JSON.parse(currentActivity.questions);
  const answers=qs.map((_,i)=>{const x=document.querySelector(`input[name=q${i}]:checked`);return x?Number(x.value):null});
  if(answers.some(x=>x===null))return toast('Responda todas as questões.');
  let score=0;qs.forEach((q,i)=>{if(answers[i]===q.correct)score++});
  const {error}=await db.from('submissions').insert({activity_id:currentActivity.id,student_id:currentStudent.id,answers,score,total:qs.length});
  if(error)return toast(error.message);
  toast(`Enviado! Nota: ${score}/${qs.length}`);document.getElementById('activityArea').classList.add('hidden');loadSubmissions();
}
async function createActivity(){
  const title=document.getElementById('newTitle').value.trim(), cls=document.getElementById('newClass').value.trim()||'TODAS';
  const desc=document.getElementById('newDesc').value.trim(), lines=document.getElementById('newQuestions').value.trim().split('\n').filter(Boolean);
  if(!title||!lines.length)return toast('Informe título e pelo menos uma questão.');
  const questions=lines.map(line=>{const p=line.split('|').map(x=>x.trim());return {question:p[0],options:p.slice(1,5),correct:Math.max(0,Math.min(3,(p[5]||'A').toUpperCase().charCodeAt(0)-65))}});
  const {error}=await db.from('activities').insert({title,student_class:cls,description:desc,questions,published:true});
  if(error)return toast(error.message);
  ['newTitle','newClass','newDesc','newQuestions'].forEach(id=>document.getElementById(id).value='');toast('Atividade publicada.');loadActivities();
}
async function loadSubmissions(){
  if(!db)return;
  const {data}=await db.from('submissions').select('id,submitted_at,score,total,students(name,student_class),activities(title)').order('submitted_at',{ascending:false});
  document.getElementById('statSubmissions').textContent=(data||[]).length;
  const {count}=await db.from('students').select('*',{count:'exact',head:true});document.getElementById('statStudents').textContent=count||0;
  document.getElementById('submissions').innerHTML=(data||[]).map(s=>`<div style="padding:10px 0;border-bottom:1px solid #e2e8f0"><b>${esc(s.students?.name)}</b> (${esc(s.students?.student_class)}) — ${esc(s.activities?.title)} — <span class="ok">${s.score}/${s.total}</span><small class="muted"> · ${new Date(s.submitted_at).toLocaleString('pt-BR')}</small></div>`).join('')||'Nenhuma entrega ainda.';
}
async function refreshTeacher(){loadSubmissions();loadActivities()}
init();
</script>
</body>
</html>
