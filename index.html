<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão Educacional</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#2563eb;--p2:#1d4ed8;--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#64748b;--border:#e2e8f0;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:700}
.top{background:linear-gradient(135deg,#1e40af,#2563eb);color:white;padding:22px 0}.wrap{max-width:1200px;margin:auto;padding:0 18px}
.brand{font-size:24px;font-weight:850}.muted{color:var(--muted)}.top .muted{color:#dbeafe}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 88px)}
.side{background:#fff;border-right:1px solid var(--border);padding:18px}.side button{width:100%;text-align:left;background:transparent;margin-bottom:5px}.side button:hover,.side .sel{background:#eff6ff;color:var(--p)}
main{padding:24px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 4px 18px #0f172a0a;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.stat{font-size:30px;font-weight:850;margin-top:5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;margin:5px 0 13px;background:white}
.primary{background:var(--p);color:#fff}.secondary{background:#e2e8f0;color:#172033}.danger{background:#fee2e2;color:#b91c1c}
.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:750}.ok{color:var(--ok);font-weight:750}
.hidden{display:none!important}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--border);font-size:14px}
.notice{padding:12px;border-radius:10px;background:#eff6ff;margin:10px 0}.login{max-width:430px;margin:8vh auto}.login .brand{text-align:center;margin-bottom:20px}
.q{border-top:1px solid var(--border);padding:18px 0}.opt{display:block;padding:8px}.opt input{width:auto;margin:0 8px 0 0}
.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:13px 16px;border-radius:10px;display:none;z-index:20}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--border);display:flex;overflow:auto;gap:5px}.side button{width:auto;white-space:nowrap}.side .logout{margin-left:auto}}
</style>
</head>
<body>
<div id="loginView" class="wrap login">
  <div class="card">
    <div class="brand">🎓 Gestão Educacional</div>
    <p class="muted" style="text-align:center">Entre com seu usuário e senha.</p>
    <label>Usuário</label><input id="loginUser" autocomplete="username">
    <label>Senha</label><input id="loginPass" type="password" autocomplete="current-password">
    <button class="primary" style="width:100%" onclick="login()">Entrar</button>
    <p id="loginMsg" class="muted"></p>
    <div class="notice"><b>Primeiro acesso?</b><br>As contas devem ser criadas pelo administrador/professor autorizado.</div>
  </div>
</div>

<div id="app" class="hidden">
<header class="top"><div class="wrap"><div class="row"><div><div class="brand">🎓 Gestão Educacional</div><div id="welcome" class="muted"></div></div><button class="secondary" onclick="logout()">Sair</button></div></div></header>
<div class="layout">
<aside class="side" id="menu"></aside>
<main id="content"></main>
</div></div>
<div id="toast" class="toast"></div>

<script>
const CONFIG={SUPABASE_URL:"COLE_AQUI_A_URL_DO_SUPABASE",SUPABASE_ANON_KEY:"COLE_AQUI_A_CHAVE_ANON"};
let db=null, user=null, profile=null, channel=null;

function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function configured(){return !CONFIG.SUPABASE_URL.startsWith("COLE_")&&!CONFIG.SUPABASE_ANON_KEY.startsWith("COLE_")}
function nav(items){document.getElementById('menu').innerHTML=items.map((x,i)=>`<button class="${i===0?'sel':''}" onclick="page('${x[0]}',this)">${x[1]}</button>`).join('')}
function page(p,b){document.querySelectorAll('.side button').forEach(x=>x.classList.remove('sel'));b?.classList.add('sel');({home:home,activities:activities,create:createActivity,classes:classes,students:students,grades:grades,profilePage:profilePage,answer:answer}[p]||home)()}
async function login(){
 if(!db)return toast('Configure o Supabase primeiro.');
 const username=document.getElementById('loginUser').value.trim(), password=document.getElementById('loginPass').value;
 if(!username||!password)return toast('Informe usuário e senha.');
 const {data,error}=await db.rpc('login_user',{p_username:username,p_password:password});
 if(error||!data?.id){document.getElementById('loginMsg').textContent='Usuário ou senha inválidos.';return}
 user=data; profile=data; sessionStorage.setItem('edu_user',JSON.stringify(data));startApp();
}
function logout(){sessionStorage.removeItem('edu_user');location.reload()}
async function startApp(){
 document.getElementById('loginView').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
 document.getElementById('welcome').textContent=`${profile.full_name} · ${profile.role==='teacher'?'Professor':'Aluno'}${profile.class_name?' · Turma '+profile.class_name:''}`;
 if(profile.role==='teacher'||profile.role==='admin') nav([['home','🏠 Dashboard'],['activities','📝 Atividades'],['create','➕ Criar atividade'],['classes','🏫 Turmas'],['students','👥 Alunos'],['grades','📊 Entregas'],['profilePage','⚙️ Perfil']]);
 else nav([['home','🏠 Início'],['activities','📝 Minhas atividades'],['grades','📊 Minhas notas'],['profilePage','⚙️ Perfil']]);
 home();subscribeRealtime();
}
function subscribeRealtime(){
 channel=db.channel('educacional-live').on('postgres_changes',{event:'*',schema:'public',table:'submissions'},()=>{if(profile.role==='teacher'||profile.role==='admin')grades();else activities()}).on('postgres_changes',{event:'*',schema:'public',table:'activities'},()=>activities()).subscribe();
}
async function home(){
 if(profile.role==='teacher'||profile.role==='admin'){
  const [{count:a},{count:s},{count:t}]=await Promise.all([db.from('activities').select('*',{count:'exact',head:true}).eq('created_by',profile.id),db.from('students').select('*',{count:'exact',head:true}),db.from('submissions').select('*',{count:'exact',head:true})]);
  document.getElementById('content').innerHTML=`<h1>Dashboard</h1><div class="grid"><div class="card"><div class="muted">Minhas atividades</div><div class="stat">${a||0}</div></div><div class="card"><div class="muted">Alunos</div><div class="stat">${s||0}</div></div><div class="card"><div class="muted">Entregas</div><div class="stat">${t||0}</div></div></div><div class="card"><h2>Recebimento em tempo real</h2><div class="notice">🟢 O painel está conectado ao banco. Novas entregas aparecem automaticamente.</div></div>`;
 }else{
  const {count}=await db.from('submissions').select('*',{count:'exact',head:true}).eq('student_id',profile.id);
  document.getElementById('content').innerHTML=`<h1>Olá, ${esc(profile.full_name)}! 👋</h1><div class="grid"><div class="card"><div class="muted">Turma</div><div class="stat">${esc(profile.class_name||'—')}</div></div><div class="card"><div class="muted">Atividades entregues</div><div class="stat">${count||0}</div></div></div><div class="card"><h2>Próximo passo</h2><button class="primary" onclick="activities()">Ver atividades</button></div>`;
 }
}
async function activities(){
 let q=db.from('activities').select('*,classes(name),profiles:created_by(full_name)').eq('published',true).order('created_at',{ascending:false});
 if(profile.role==='student')q=q.eq('class_id',profile.class_id);
 else q=q.eq('created_by',profile.id);
 const {data,error}=await q;if(error)return toast(error.message);
 document.getElementById('content').innerHTML=`<div class="row"><h1>Atividades</h1>${profile.role!=='student'?'<button class="primary" onclick="createActivity()">Nova atividade</button>':''}</div>`+
 (data||[]).map(a=>`<div class="card"><div class="row"><div><span class="badge">${esc(a.classes?.name||'Todas')}</span><h2 style="margin:8px 0">${esc(a.title)}</h2><p class="muted">${esc(a.description||'')}</p><small>Questões: ${a.questions.length} · Prazo: ${a.due_at?new Date(a.due_at).toLocaleString('pt-BR'):'Sem prazo'}</small></div><button class="primary" onclick="${profile.role==='student'?`answer('${a.id}')`:`viewActivity('${a.id}')`}">${profile.role==='student'?'Responder':'Ver detalhes'}</button></div></div>`).join('')||'<div class="card">Nenhuma atividade disponível.</div>';
}
async function createActivity(){
 const {data:classesData}=await db.from('classes').select('*').order('name');const cs=classesData||[];
 document.getElementById('content').innerHTML=`<h1>Criar atividade</h1><div class="card">
 <h2>1. Gerar a partir de conteúdo</h2><p class="muted">Informe o conteúdo. O sistema prepara uma atividade para o professor revisar antes de publicar.</p>
 <label>Conteúdo</label><textarea id="aiContent" rows="4" placeholder="Ex.: Frações: adição, subtração, multiplicação e divisão — 7º ano"></textarea>
 <div class="grid"><div><label>Quantidade de questões</label><input id="aiQty" type="number" value="10" min="1" max="30"></div><div><label>Dificuldade</label><select id="aiDiff"><option>Fácil</option><option selected>Média</option><option>Difícil</option></select></div></div>
 <button class="primary" onclick="generateDraft()">Gerar rascunho</button>
 </div>
 <div class="card"><h2>2. Enviar/criar atividade pronta</h2>
 <label>Título</label><input id="title" placeholder="Título da atividade">
 <label>Turma</label><select id="classId">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
 <label>Descrição</label><textarea id="desc"></textarea>
 <label>Prazo</label><input id="due" type="datetime-local">
 <label>Questões JSON</label><textarea id="questions" rows="12" placeholder='[{"question":"Quanto é 2+2?","options":["3","4","5","6"],"correct":1}]'></textarea>
 <div class="row"><button class="secondary" onclick="previewQuestions()">Revisar</button><button class="primary" onclick="publishActivity()">Publicar atividade</button></div></div>`;
}
function generateDraft(){
 const c=document.getElementById('aiContent').value.trim(),n=Number(document.getElementById('aiQty').value)||10,d=document.getElementById('aiDiff').value;
 if(!c)return toast('Informe o conteúdo.');
 // O gerador local cria um rascunho inicial. Para geração por IA generativa,
 // conecte uma Edge Function segura com a chave do provedor de IA.
 const qs=Array.from({length:n},(_,i)=>({question:`Questão ${i+1} — revise e complete com base no conteúdo: ${c}`,options:["Alternativa A","Alternativa B","Alternativa C","Alternativa D"],correct:0}));
 document.getElementById('questions').value=JSON.stringify(qs,null,2);
 document.getElementById('desc').value=`Atividade gerada a partir do conteúdo informado. Dificuldade: ${d}. Revise as questões antes de publicar.`;
 toast('Rascunho criado para revisão.');
}
function previewQuestions(){try{const q=JSON.parse(document.getElementById('questions').value);alert(q.map((x,i)=>`${i+1}. ${x.question}\nA) ${x.options[0]}\nB) ${x.options[1]}\nC) ${x.options[2]}\nD) ${x.options[3]}\nGabarito: ${'ABCD'[x.correct]}`).join('\n\n'))}catch(e){toast('JSON inválido.')}}
async function publishActivity(){
 try{const q=JSON.parse(document.getElementById('questions').value);if(!q.length)throw 0;
 const payload={title:document.getElementById('title').value.trim(),description:document.getElementById('desc').value.trim(),class_id:document.getElementById('classId').value,due_at:document.getElementById('due').value||null,questions:q,created_by:profile.id,published:true};
 if(!payload.title) return toast('Informe o título.');
 const {error}=await db.from('activities').insert(payload);if(error)throw error;toast('Atividade publicada!');activities();
 }catch(e){toast(e.message||'Verifique os dados da atividade.')}
}
async function answer(id){
 const {data:a,error}=await db.from('activities').select('*').eq('id',id).single();if(error)return toast(error.message);
 const {data:old}=await db.from('submissions').select('*').eq('activity_id',id).eq('student_id',profile.id).maybeSingle();
 if(old)return toast(`Você já entregou esta atividade. Nota: ${old.score}/${old.total}`);
 document.getElementById('content').innerHTML=`<div class="row"><h1>${esc(a.title)}</h1><button class="secondary" onclick="activities()">Voltar</button></div><div class="card"><p>${esc(a.description||'')}</p><div id="formQs">${a.questions.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b>${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`).join('')}</div><button class="primary" onclick="submitAnswer('${a.id}')">Enviar atividade</button></div>`;
}
async function submitAnswer(id){
 const {data:a}=await db.from('activities').select('*').eq('id',id).single();let answers=a.questions.map((_,i)=>{let x=document.querySelector(`input[name=q${i}]:checked`);return x?Number(x.value):null});
 if(answers.some(x=>x===null))return toast('Responda todas as questões.');
 let score=a.questions.reduce((s,q,i)=>s+(answers[i]===q.correct?1:0),0);
 const {error}=await db.from('submissions').insert({activity_id:id,student_id:profile.id,answers,score,total:a.questions.length});if(error)return toast(error.message);
 toast(`Entrega recebida: ${score}/${a.questions.length}`);activities();
}
async function grades(){
 let q=db.from('submissions').select('*,students:student_id(full_name,class_id,classes:class_id(name)),activities:activity_id(title)').order('submitted_at',{ascending:false});
 if(profile.role==='student')q=q.eq('student_id',profile.id); else {const ids=(await db.from('activities').select('id').eq('created_by',profile.id)).data?.map(x=>x.id)||[];q=q.in('activity_id',ids.length?ids:['00000000-0000-0000-0000-000000000000'])}
 const {data,error}=await q;if(error)return toast(error.message);
 document.getElementById('content').innerHTML=`<h1>${profile.role==='student'?'Minhas notas':'Entregas em tempo real'}</h1><div class="card"><table><thead><tr><th>Aluno</th><th>Turma</th><th>Atividade</th><th>Nota</th><th>Entrega</th></tr></thead><tbody>${(data||[]).map(s=>`<tr><td>${esc(s.students?.full_name||profile.full_name)}</td><td>${esc(s.students?.classes?.name||profile.class_name||'')}</td><td>${esc(s.activities?.title)}</td><td class="ok">${s.score}/${s.total}</td><td>${new Date(s.submitted_at).toLocaleString('pt-BR')}</td></tr>`).join('')}</tbody></table></div>`;
}
async function classes(){const {data}=await db.from('classes').select('*').order('name');document.getElementById('content').innerHTML=`<h1>Turmas</h1><div class="card"><table><tr><th>Turma</th><th>Ano</th><th>Turno</th></tr>${(data||[]).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.grade)}</td><td>${esc(c.shift)}</td></tr>`).join('')}</table></div>`}
async function students(){const {data}=await db.from('students').select('*,classes:class_id(name)').order('full_name');document.getElementById('content').innerHTML=`<h1>Alunos</h1><div class="card"><table><tr><th>Aluno</th><th>Usuário</th><th>Turma</th></tr>${(data||[]).map(s=>`<tr><td>${esc(s.full_name)}</td><td>${esc(s.username)}</td><td>${esc(s.classes?.name)}</td></tr>`).join('')}</table></div>`}
async function profilePage(){document.getElementById('content').innerHTML=`<h1>Perfil</h1><div class="card"><b>${esc(profile.full_name)}</b><p class="muted">Usuário: ${esc(profile.username)} · Perfil: ${esc(profile.role)}</p></div>`}
async function viewActivity(id){const {data:a}=await db.from('activities').select('*').eq('id',id).single();document.getElementById('content').innerHTML=`<div class="card"><h1>${esc(a.title)}</h1><p>${esc(a.description||'')}</p><p><b>${a.questions.length}</b> questões · ${a.published?'Publicada':'Rascunho'}</p><button class="secondary" onclick="activities()">Voltar</button></div>`}
async function init(){
 if(!configured()){document.getElementById('loginMsg').textContent='Configure as credenciais do Supabase no index.html.';return}
 db=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
 const saved=sessionStorage.getItem('edu_user');if(saved){profile=JSON.parse(saved);user=profile;startApp()}
}
init();
</script>
</body></html>
